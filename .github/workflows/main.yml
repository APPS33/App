name: Android Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          # تم تصحيح اسم الحزمة libavformat-dev وحذف الحزم غير المتوفرة
          sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-en libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          pip install --upgrade pip
          pip install --user --upgrade buildozer Cython==0.29.33 virtualenv

      - name: Build APK
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # توليد ملف الإعدادات إذا لم يكن موجوداً (للاحتياط)
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          # الموافقة على الرخص وبدء البناء
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: To-Do-App-Final
          path: bin/*.apk
