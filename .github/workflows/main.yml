name: Build and Release APK

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  # 1. مرحلة إصلاح الكود وتنسيقه
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Auto-format code
        run: |
          pip install black
          black .
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Fix: Auto-format Python code"

  # 2. مرحلة بناء الـ APK
  build:
    needs: lint-and-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        # استخدمنا هنا الأكشن الرسمي والبديل المضمون
        uses: kivy/buildozer-action@master
        with:
          command: buildozer android debug
          buildozer_version: master

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: To-Do-App-Build
          path: bin/*.apk
